name: Avisar release no Discord

on:
  release:
    types: [published]

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar link da release
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NOME: ${{ github.event.release.name }}
          TAG: ${{ github.event.release.tag_name }}
          LINK: ${{ github.event.release.html_url }}
        run: |
          jq -n --arg nome "${NOME:-$TAG}" --arg link "$LINK" \
            '{content: "🚀 Nova versão: **\($nome)**\n\($link)"}' \
          | curl -sSf -H "Content-Type: application/json" -d @- "$WEBHOOK"
